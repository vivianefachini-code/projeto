<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Sabino 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-color: #ffffff;
            --lavender-soft: #f3e8ff;
            --lavender-dark: #a855f7;
            --green-soft: #f0fdf4;
            --green-dark: #22c55e;
            --accent-purple: #9333ea;
            --bg-main: #fcfaff;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #374151;
            margin: 0;
            font-size: 0.85rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--lavender-soft);
        }

        .book-container {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 12px;
            max-width: 1800px;
            margin: 0 auto;
            padding: 12px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--lavender-soft);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
        }

        .agenda-page {
            background: white;
            min-height: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.05);
            padding: 24px;
            border: 1px solid var(--lavender-soft);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .calendar-day {
            background: white;
            aspect-ratio: 1 / 0.85;
            padding: 3px;
            border: 1px solid #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }

        .calendar-day:hover { background-color: var(--lavender-soft); }
        .calendar-day.selected { border: 2px solid var(--lavender-dark); background: var(--lavender-soft); }
        .calendar-day.other-month { opacity: 0.3; }

        .cal-icon { position: absolute; font-size: 10px; line-height: 1; }
        .icon-top-left { top: 2px; left: 2px; }
        .icon-top-right { top: 2px; right: 2px; }
        .icon-center { top: 55%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; opacity: 0.8;}

        .dots-container {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        .dot { width: 4px; height: 4px; border-radius: 50%; }

        .btn-kawaii {
            border-radius: 10px;
            padding: 6px 12px;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.75rem;
            width: 110px; /* Mesma largura para todos */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-purple { background: var(--lavender-soft); color: var(--lavender-dark); }
        .btn-green { background: var(--green-soft); color: var(--green-dark); }
        .btn-blue { background: #eff6ff; color: #3b82f6; }
        .btn-nav { background: #f3f4f6; color: #4b5563; padding: 4px 10px; border-radius: 8px; font-weight: bold; }

        .progress-bar { height: 6px; border-radius: 3px; background: #f3f4f6; overflow: hidden; margin-top: 3px; }
        .progress-fill { height: 100%; transition: width 0.3s; }

        input, textarea, select {
            border: 1.5px solid var(--lavender-soft);
            border-radius: 10px;
            padding: 6px 8px;
            outline: none;
            font-size: 0.8rem;
        }
        input:focus, textarea:focus { border-color: var(--lavender-dark); }

        .sidebar-fixed { position: sticky; top: 100px; }
        
        h2 { font-size: 1.5rem !important; }
        h3 { font-size: 0.9rem !important; margin-bottom: 8px !important; }
        section { margin-bottom: 1.5rem !important; }

        .journal-entry {
            border-left: 3px solid var(--lavender-soft);
            padding-left: 10px;
            position: relative;
        }
        .journal-entry:before {
            content: '';
            position: absolute;
            left: -6.5px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: white;
            border: 2px solid var(--lavender-dark);
            border-radius: 50%;
        }

        /* Tabela Estilos */
        .table-view-container {
            max-height: 750px;
            overflow: auto;
            background: white;
            border-radius: 20px;
            border: 1px solid var(--lavender-soft);
            padding: 16px;
            position: relative;
        }
        table.minimalist {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        table.minimalist th {
            background: var(--lavender-soft);
            padding: 8px;
            text-align: left;
            border-bottom: 2px solid white;
            position: sticky;
            top: -16px; 
            z-index: 10;
        }
        table.minimalist td {
            padding: 6px 8px;
            border-bottom: 1px solid #f9fafb;
        }
        table.minimalist tr:hover { background: #fcfaff; }

        .aside-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Grid alinhado para as tabelas laterais */
        .aside-grid-bday {
            display: grid;
            grid-template-columns: 45px 25px 1fr;
            gap: 4px;
            align-items: center;
        }
        .aside-grid-event {
            display: grid;
            grid-template-columns: 45px 25px 1fr 50px;
            gap: 4px;
            align-items: center;
        }
    </style>
</head>
<body>

    <header class="p-2 mb-1">
        <div class="max-w-[1800px] mx-auto px-3 grid grid-cols-[320px_1fr_320px] items-center gap-3">
            <h1 class="text-xl font-bold text-purple-600">Planner Sabino</h1>
            
            <div class="flex items-center gap-2 justify-center">
                <div class="relative">
                    <input type="text" id="globalSearch" oninput="renderView()" placeholder="Procurar..." class="pl-8 w-48 text-xs">
                    <span class="absolute left-2 top-1 text-xs">🔍</span>
                </div>
                
                <div class="flex items-center gap-1 bg-gray-50 p-1 rounded-xl border border-lavender-soft">
                    <button onclick="navigateDate(-1)" class="btn-nav hover:bg-gray-200 transition text-xs">❮</button>
                    <input type="date" id="dateJump" onchange="jumpToDate()" class="text-xs border-none bg-transparent p-1">
                    <button onclick="navigateDate(1)" class="btn-nav hover:bg-gray-200 transition text-xs">❯</button>
                </div>
            </div>

            <div class="flex justify-end items-center gap-2">
                <button onclick="changeView('calendar')" class="btn-kawaii btn-purple">Calendário</button>
                <button onclick="goToToday()" class="btn-kawaii btn-green">Hoje</button>
                <button onclick="changeView('table')" class="btn-kawaii btn-blue">Tabela</button>
            </div>
        </div>
    </header>

    <div class="book-container">
        <aside class="sidebar-fixed">
            <div class="card">
                <h3 class="font-bold text-gray-400 text-[10px] uppercase mb-2 tracking-widest">Resumo do Mês</h3>
                <div class="space-y-1 text-xs" id="quickStats">
                    <div class="flex justify-between"><span>Dias úteis:</span> <b id="statWorkDays">0</b></div>
                    <div class="flex justify-between"><span>Restantes:</span> <b id="statRemDays">0</b></div>
                    <div class="flex justify-between text-purple-600"><span>Compromissos:</span> <b id="statEvents">0</b></div>
                </div>
            </div>
            <div id="goalCards" class="space-y-2"></div>
            <div id="collectionStats" class="space-y-1.5 mt-2"></div>
        </aside>

        <main>
            <div id="calendarView" class="hidden">
                <div class="card">
                    <div class="flex justify-between items-center mb-2">
                        <button onclick="changeMonth(-1)" class="p-1 hover:bg-gray-100 rounded-full text-xs">❮</button>
                        <h2 id="currentMonthLabel" class="text-xs font-bold uppercase tracking-widest text-gray-600"></h2>
                        <button onclick="changeMonth(1)" class="p-1 hover:bg-gray-100 rounded-full text-xs">❯</button>
                    </div>
                    <div class="grid grid-cols-7 text-center text-[9px] font-bold text-gray-400 mb-1">
                        <span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span>
                    </div>
                    <div id="calendarGrid" class="calendar-grid"></div>
                </div>
            </div>

            <div id="tableView" class="hidden table-view-container">
                <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">📊 Tabela Mensal <span id="tableMonthLabel" class="text-xs font-normal text-gray-400 uppercase"></span></h2>
                <div id="tableContent"></div>
            </div>

            <div id="dailyView" class="agenda-page">
                <div class="flex justify-between items-start mb-4 border-b pb-4">
                    <div>
                        <h2 id="dayTitle" class="text-2xl font-bold text-gray-700"></h2>
                        <p id="fullDateLabel" class="text-gray-400 uppercase text-[10px] font-bold mt-0.5"></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="moodSelector" onchange="updateDay('mood', this.value)" class="text-[11px] py-0 px-3 w-36 h-10 leading-10 appearance-none bg-white">
                            <option value="">☁️ Como está o Humor?</option>
                            <option value="😭">😭 Muito Triste</option>
                            <option value="🙁">🙁 Triste</option>
                            <option value="😐">😐 Neutro</option>
                            <option value="😊">😊 Feliz</option>
                            <option value="🤩">🤩 Super Feliz</option>
                        </select>
                        <label class="flex items-center justify-center gap-2 text-[9px] font-bold text-red-400 bg-red-50 px-4 h-10 w-40 rounded-xl border border-red-100 cursor-pointer whitespace-nowrap transition hover:bg-red-100">
                            <input type="checkbox" id="periodCheck" onchange="updateDay('period', this.checked)" class="w-3 h-3 accent-red-500"> 🩸 MENSTRUAÇÃO
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6 items-start">
                    <div class="space-y-4">
                        <section>
                            <h3 class="text-purple-500 flex items-center gap-2">✅ Tarefas</h3>
                            <div id="habitList" class="space-y-1.5"></div>
                        </section>
                        
                        <section>
                            <h3 class="text-blue-500">📖 Coleções</h3>
                            <div id="mediaContainer" class="space-y-3"></div>
                        </section>
                    </div>

                    <div class="space-y-4">
                        <section class="bg-green-50 p-4 rounded-2xl border border-green-100 !mb-0">
                            <h3 class="text-green-600">💊 Medicamentos</h3>
                            <div id="medList" class="space-y-1.5 mb-3"></div>
                            <button onclick="openMedModal()" class="w-full py-1.5 bg-white border border-green-200 text-green-600 text-[10px] font-bold rounded-lg hover:bg-green-100">+ Adicionar Medicamento</button>
                        </section>

                        <section class="bg-purple-50 p-4 rounded-2xl border border-purple-100 !mb-0">
                            <h3 class="text-purple-600">🏷️ Agenda</h3>
                            <div id="dayEvents" class="space-y-1.5 mb-3"></div>
                            <div class="flex gap-1.5">
                                <button onclick="addEntry('event')" class="flex-1 py-1.5 bg-white text-blue-500 text-[9px] font-bold rounded-lg border border-blue-100">+ EVENTO</button>
                                <button onclick="addEntry('birthday')" class="flex-1 py-1.5 bg-white text-orange-500 text-[9px] font-bold rounded-lg border border-orange-100">+ ANIVERSÁRIO</button>
                            </div>
                        </section>

                        <section class="pt-2">
                            <h3 class="text-gray-400 mb-2">📔 Registros</h3>
                            <div class="mb-4 bg-gray-50 p-3 rounded-xl border border-lavender-soft">
                                <textarea id="journalInput" class="w-full h-24 text-xs resize-none bg-white mb-2" placeholder="Escreva sobre o seu dia aqui..."></textarea>
                                <div class="flex justify-end">
                                    <button onclick="saveJournalEntry()" class="bg-purple-500 text-white px-4 py-1.5 rounded-lg text-[10px] font-bold hover:bg-purple-600 transition">Salvar Anotação</button>
                                </div>
                            </div>
                            <div id="journalList" class="space-y-4 max-h-96 overflow-y-auto pr-2 mt-2"></div>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <aside class="sidebar-fixed">
            <div class="card border-orange-100">
                <h3 class="font-bold text-orange-400 text-[10px]  mb-2">🎂 Aniversários</h3>
                <div class="grid grid-cols-1 gap-1 text-[10px] font-bold text-gray-400 mb-2 px-1.5 aside-grid-bday">
                </div>
                <div id="asideBirthdays" class="text-[11px] space-y-1.5"></div>
            </div>
            <div class="card border-blue-100">
                <h3 class="font-bold text-blue-400 text-[10px]  mb-2">📅 Compromissos</h3>
                <div class="grid grid-cols-1 gap-1 text-[10px] font-bold text-gray-400 mb-2 px-1.5 aside-grid-event">
                </div>
                <div id="asideEvents" class="text-[11px] space-y-1.5"></div>
            </div>
        </aside>
    </div>

    <div id="medModal" class="hidden fixed inset-0 bg-black/20 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-green-600">Novo Medicamento</h2>
            <div class="space-y-3">
                <input type="text" id="mName" placeholder="Nome" class="w-full">
                <input type="text" id="mTime" placeholder="Horário (ex: 08:00)" class="w-full">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[9px] font-bold text-gray-400 uppercase">Início</label>
                        <input type="date" id="mStartDate" class="w-full text-xs">
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-gray-400 uppercase">Término</label>
                        <input type="date" id="mEndDate" class="w-full text-xs">
                    </div>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-gray-400 uppercase">Frequência</label>
                    <select id="mFreq" class="w-full text-xs">
                        <option value="daily">Todo dia</option>
                        <option value="seg_qua_sex">Seg, Qua, Sex</option>
                        <option value="ter_qui">Ter, Qui</option>
                        <option value="weekend">Fim de Semana</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeMedModal()" class="flex-1 py-2 bg-gray-100 rounded-lg text-xs font-bold">Cancelar</button>
                    <button id="btnSaveMed" onclick="saveMed()" class="flex-1 py-2 bg-green-500 text-white rounded-lg text-xs font-bold">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="max-w-7xl mx-auto p-4 flex flex-wrap justify-center gap-2 border-t mt-4">
        <button onclick="backupJSON()" class="btn-kawaii bg-gray-100 text-gray-500" style="width: auto;">💾 Backup</button>
        <button onclick="document.getElementById('importInput').click()" class="btn-kawaii bg-gray-100 text-gray-500" style="width: auto;">📂 Restaurar</button>
        <input type="file" id="importInput" class="hidden" accept=".json" onchange="restoreJSON(event)">
        <button onclick="exportCSV()" class="btn-kawaii bg-gray-100 text-gray-500" style="width: auto;">📊 CSV</button>
        <button onclick="clearAll()" class="btn-kawaii bg-red-50 text-red-400" style="width: auto;">🗑️ Limpar Tudo</button>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE (SUBSTITUA PELOS SEUS DADOS)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const fbDb = getFirestore(app);
        const docRef = doc(fbDb, "planner", "dados_gerais");

        // Banco de dados local inicial
        let db = JSON.parse(localStorage.getItem('sabino_planner_v2')) || { days: {}, meds: [] };

        // Função de salvar unificada (Local + Nuvem)
        const save = async () => {
            localStorage.setItem('sabino_planner_v2', JSON.stringify(db));
            try {
                await setDoc(docRef, db);
                console.log("Sincronizado com Firebase");
            } catch (e) {
                console.error("Erro ao sincronizar com nuvem: ", e);
            }
        };

        // Função para carregar da nuvem ao iniciar
        async function loadFromCloud() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    db = docSnap.data();
                    localStorage.setItem('sabino_planner_v2', JSON.stringify(db));
                    renderView();
                }
            } catch (e) {
                console.error("Erro ao carregar da nuvem: ", e);
            }
        }

        let currentViewDate = new Date();
        let selectedDateStr = new Date().toISOString().split('T')[0];
        let currentView = 'day';

        const MONTHS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const HABITS = [
            { id: 'workout', label: '💪 Treino', meta: 12, color: '#22c55e' },
            { id: 'walk', label: '🐾 Passeio', meta: 15, color: '#fbbf24' }
        ];
        const COLLECTIONS = [
            { id: 'study', label: 'Estudos', unit: '', icon: '📚' },
            { id: 'reading', label: 'Leitura', unit: 'Paginas', icon: '📖' },
            { id: 'games', label: 'Jogos', unit: 'Minutos', icon: '🎮' },
            { id: 'movies', label: 'Filme/Série', unit: 'Minutos', icon: '🎬' },
            { id: 'cleaning', label: 'Limpeza da casa', unit: '', icon: '🧹' },
            { id: 'hobbies', label: 'Hobbies', unit: '', icon: '✨' },
            { id: 'others', label: 'Outras Atividades', unit: '', icon: '✨' }
        ];

        function init() { 
            document.getElementById('dateJump').value = selectedDateStr;
            loadFromCloud(); // Tenta buscar os dados salvos no Google
            renderView(); 
        }

        function renderView() {
            document.getElementById('calendarView').classList.add('hidden');
            document.getElementById('dailyView').classList.add('hidden');
            document.getElementById('tableView').classList.add('hidden');

            if (currentView === 'calendar') {
                document.getElementById('calendarView').classList.remove('hidden');
                renderCalendar();
            } else if (currentView === 'table') {
                document.getElementById('tableView').classList.remove('hidden');
                renderTable();
            } else {
                document.getElementById('dailyView').classList.remove('hidden');
                renderDaily();
            }
            document.getElementById('dateJump').value = selectedDateStr;
            renderStats();
            renderAsideLists();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            document.getElementById('currentMonthLabel').innerText = `${MONTHS[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const search = document.getElementById('globalSearch').value.toLowerCase();
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="calendar-day other-month"></div>`;
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayData = db.days[dateStr] || {};
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${dateStr === selectedDateStr ? 'selected' : ''}`;
                if (search && JSON.stringify(dayData).toLowerCase().includes(search)) dayDiv.style.backgroundColor = '#fef9c3';
                let html = `<span class="text-[8px] font-bold text-gray-400">${d}</span>`;
                if (dayData.mood) html += `<span class="cal-icon icon-top-left">${dayData.mood}</span>`;
                if (dayData.events?.length > 0) html += `<span class="cal-icon icon-top-right">📅</span>`;
                if (dayData.birthdays?.length > 0) html += `<span class="cal-icon icon-center">🎂</span>`;
                let dots = '<div class="dots-container">';
                HABITS.forEach(h => { if(dayData[h.id]) dots += `<div class="dot" style="background:${h.color}"></div>`; });
                COLLECTIONS.forEach(c => { if(dayData[c.id]?.length > 0) dots += `<div class="dot" style="background:#cbd5e1"></div>`; });
                html += dots + '</div>';
                dayDiv.innerHTML = html;
                dayDiv.onclick = () => { selectedDateStr = dateStr; changeMonthToSelection(dateStr); changeView('day'); };
                grid.appendChild(dayDiv);
            }
        }

        function changeMonthToSelection(dateStr) {
            currentViewDate = new Date(dateStr + 'T12:00:00');
        }

        function renderTable() {
            const container = document.getElementById('tableContent');
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            document.getElementById('tableMonthLabel').innerText = `${MONTHS[month]} ${year}`;
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let html = `<table class="minimalist"><thead><tr>`;
            html += `<th>Data</th><th>Humor</th><th>🩸</th>`;
            HABITS.forEach(h => html += `<th>${h.label.split(' ')[1] || h.label}</th>`);
            COLLECTIONS.forEach(c => html += `<th>${c.label}</th>`);
            html += `</tr></thead><tbody>`;

            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const data = db.days[dateStr] || {};
                const dObj = new Date(dateStr + 'T12:00:00');
                const isWeekend = dObj.getDay() === 0 || dObj.getDay() === 6;
                
                html += `<tr class="${isWeekend ? 'bg-gray-50' : ''} ${dateStr === selectedDateStr ? 'bg-lavender-soft/30' : ''}">`;
                html += `<td class="font-bold cursor-pointer hover:text-purple-600" onclick="goToSpecificDate('${dateStr}')">${d}/${month+1}</td>`;
                html += `<td>${data.mood || '-'}</td>`;

        function exportCSV() {
            const sep = ";";
            const moodMap = { "😭": "Muito Triste", "🙁": "Triste", "😐": "Neutro", "😊": "Feliz", "🤩": "Super Feliz" };
            const cleanHeader = (str) => {
                return str.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '').replace(/[^a-zA-Z0-9\s]/g, "").trim().replace(/\s+/g, '_'); 
            };
            let headers = ["Data", "Humor", "Periodo_Menstruacao", "Diario_Total"];
            HABITS.forEach(h => headers.push(cleanHeader(h.label)));
            COLLECTIONS.forEach(c => {
                const baseName = cleanHeader(c.label);
                headers.push(baseName);
                if (c.unit) headers.push(`${baseName}_${cleanHeader(c.unit)}`);
            });
            db.meds.forEach((m, idx) => { headers.push(`${cleanHeader(m.name)}_${cleanHeader(m.time)}`); });
            headers.push("Eventos", "Aniversarios");
            let csvRows = [headers.join(sep)];
            Object.keys(db.days).sort().forEach(dateStr => {
                const dayData = db.days[dateStr];
                let collectionsGrouped = {}; let maxSubRows = 1;
                COLLECTIONS.forEach(c => {
                    const logs = dayData[c.id] || [];
                    if (logs.length > 0) {
                        let grouped = {};
                        logs.forEach(log => {
                            const name = log.name || "Sem Nome";
                            if (!grouped[name]) grouped[name] = { name: name, val: c.unit ? 0 : log.val };
                            if (c.unit) grouped[name].val += (parseInt(log.val) || 0);
                        });
                        collectionsGrouped[c.id] = Object.values(grouped);
                        if (collectionsGrouped[c.id].length > maxSubRows) maxSubRows = collectionsGrouped[c.id].length;
                    } else collectionsGrouped[c.id] = [];
                });
                for (let i = 0; i < maxSubRows; i++) {
                    let row = [dateStr]; const isFirstLineOfDay = (i === 0);
                    if (isFirstLineOfDay) {
                        row.push(`"${moodMap[dayData.mood] || dayData.mood || ""}"`, dayData.period ? "Feito" : "");
                        const journalTxt = (dayData.journalEntries || []).map(e => `[${e.time}] ${e.text}`).join(" | ");
                        row.push(`"${journalTxt.replace(/"/g, '""')}"`);
                        HABITS.forEach(h => row.push(dayData[h.id] ? "Feito" : ""));
                    } else {
                        row.push("", "", ""); HABITS.forEach(() => row.push(""));
                    }
                    COLLECTIONS.forEach(c => {
                        const items = collectionsGrouped[c.id];
                        if (items && items[i]) { row.push(`"${items[i].name}"`); if (c.unit) row.push(items[i].val); } else { row.push(""); if (c.unit) row.push(""); }
                    });
                    if (isFirstLineOfDay) {
                        db.meds.forEach((m, idx) => row.push(dayData[`med_taken_${idx}`] ? "Feito" : ""));
                        const events = (dayData.events || []).map(e => `${e.name} (${e.time}) - Obs: ${e.obs || ""}`).join(" | ");
                        const bdays = (dayData.birthdays || []).join(" | ");
                        row.push(`"${events}"`, `"${bdays}"`);
                    } else {
                        db.meds.forEach(() => row.push("")); row.push("", "");
                    }
                    csvRows.push(row.join(sep));
                }
            });
            const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "planner_sabino_detalhado.csv"; a.click();
        }

        // Exportando funções para o HTML (Necessário por usar type="module")
        window.init = init;
        window.renderView = renderView;
        window.navigateDate = navigateDate;
        window.jumpToDate = jumpToDate;
        window.goToToday = goToToday;
        window.changeView = changeView;
        window.updateDay = updateDay;
        window.addEntry = addEntry;
        window.removeEntry = removeEntry;
        window.addMedia = addMedia;
        window.removeMedia = removeMedia;
        window.saveJournalEntry = saveJournalEntry;
        window.removeJournalEntry = removeJournalEntry;
        window.openMedModal = openMedModal;
        window.closeMedModal = closeMedModal;
        window.saveMed = saveMed;
        window.deleteMed = deleteMed;
        window.backupJSON = backupJSON;
        window.restoreJSON = restoreJSON;
        window.exportCSV = exportCSV;
        window.clearAll = clearAll;
        window.changeMonth = changeMonth;
        window.goToSpecificDate = goToSpecificDate;
        window.editEntry = editEntry;

        window.onload = init;
    </script>
